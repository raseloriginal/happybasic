name: Deploy draft to v2
on:
  push:
    branches: [draft]
concurrency: deploy-v2
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          install -m 700 -d ~/.ssh
          # Secret may be the raw PEM or its base64 (single line, paste-safe).
          if printf '%s' "$SSH_KEY" | grep -q 'BEGIN'; then
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          else
            printf '%s' "$SSH_KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/id_deploy
          fi
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$HOST" "bash '$APP_DIR/deploy.sh'"
